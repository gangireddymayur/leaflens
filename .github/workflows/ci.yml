name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run tests (data splitting and metrics; no GPU or torch needed)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check that every module compiles
        run: python -m compileall -q src
